services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kijani_app
    working_dir: /var/www

    # 🔑 Run container as your local user
    user: "${UID}:${GID}"

    volumes:
      - ./apps/backend:/var/www

    depends_on:
      - postgres
      - redis

    networks:
      - kijani_net


  nginx:
    image: nginx:1.27-alpine
    container_name: kijani_nginx

    ports:
      - "8080:80"

    volumes:
      - ./apps/backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - kijani_net


  postgres:
    image: postgres:16-alpine
    container_name: kijani_postgres
    restart: unless-stopped

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - kijani_net


  redis:
    image: redis:7-alpine
    container_name: kijani_redis

    volumes:
      - redis_data:/data

    networks:
      - kijani_net


  mailpit:
    image: axllent/mailpit
    container_name: kijani_mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - kijani_net


volumes:
  postgres_data:
  redis_data:

networks:
  kijani_net:
    driver: bridge