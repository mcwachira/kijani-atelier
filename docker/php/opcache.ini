; Enable OPcache (improves performance by caching compiled PHP code)
opcache.enable=1

; Memory allocated for OPcache
opcache.memory_consumption=128

; Buffer size for interned strings
opcache.interned_strings_buffer=8

; Max number of cached PHP files
opcache.max_accelerated_files=10000

; How often to check for file changes (in seconds)
; lower = better for development, higher = better for production
opcache.revalidate_freq=2

; Validate timestamps (set to 0 in production for max performance)
opcache.validate_timestamps=1