server {
    listen 80;

    # Domain name (localhost for development)
    server_name localhost;

    # Laravel public directory (IMPORTANT)
    root /var/www/public;

    # Default index files
    index index.php index.html;

    # Max upload size (for images, etc.)
    client_max_body_size 20M;

    # Handle all requests through Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;  # connects to PHP container
        fastcgi_index index.php;

        include fastcgi.conf;   # correct config (fixes bugs)

        # Tells PHP which file to execute
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }
}